<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">有两个原点的直线示意图</title>
  <desc id="desc">两条实直线除原点外的点被识别为同一点，但两个原点保留为不同点。两个原点附近的任意邻域都会在非零点处相交，因此不能被不相交开邻域分开。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6b7280"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.5; }
      .axis { stroke: #111827; stroke-width: 3; marker-end: url(#arrow); }
      .axis-light { stroke: #6b7280; stroke-width: 2.2; marker-end: url(#arrow); }
      .identified { stroke: #2563eb; stroke-width: 8; stroke-linecap: round; opacity: 0.28; }
      .neighborhood-a { fill: #93c5fd; fill-opacity: 0.28; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .neighborhood-b { fill: #fca5a5; fill-opacity: 0.28; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .overlap { fill: #a7f3d0; fill-opacity: 0.75; stroke: #059669; stroke-width: 2; }
      .point-a { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
      .point-b { fill: #dc2626; stroke: #ffffff; stroke-width: 2; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; }
      .small { font-size: 14px; fill: #4b5563; }
      .math { font-family: "Times New Roman", serif; font-size: 20px; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" width="980" height="430"/>
  <rect class="panel" x="30" y="28" width="920" height="374" rx="8"/>

  <text x="60" y="68" class="text title">有两个原点的直线：局部像直线，但不是 Hausdorff</text>
  <text x="60" y="96" class="text small">除原点外，两条直线上的同名点被识别；两个原点 0₁ 与 0₂ 保留为不同点。</text>

  <!-- Two source lines -->
  <line x1="100" y1="160" x2="420" y2="160" class="axis-light"/>
  <line x1="100" y1="250" x2="420" y2="250" class="axis-light"/>
  <circle cx="250" cy="160" r="8" class="point-a"/>
  <circle cx="250" cy="250" r="8" class="point-b"/>
  <text x="232" y="143" class="math">0₁</text>
  <text x="232" y="282" class="math">0₂</text>
  <text x="105" y="142" class="text small">第一条实线</text>
  <text x="105" y="232" class="text small">第二条实线</text>
  <text x="320" y="190" class="text small">x ≠ 0 的点相互识别</text>

  <path d="M465 205 C500 205, 520 205, 555 205" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="468" y="186" class="text small">粘合后</text>

  <!-- Quotient line with two origins -->
  <line x1="610" y1="205" x2="900" y2="205" class="axis"/>
  <path d="M648 205 L735 205" class="identified"/>
  <path d="M765 205 L856 205" class="identified"/>
  <circle cx="755" cy="176" r="9" class="point-a"/>
  <circle cx="755" cy="234" r="9" class="point-b"/>
  <text x="770" y="181" class="math">0₁</text>
  <text x="770" y="241" class="math">0₂</text>

  <!-- Neighborhoods around two origins overlap after identification -->
  <ellipse cx="755" cy="176" rx="82" ry="34" class="neighborhood-a"/>
  <ellipse cx="755" cy="234" rx="82" ry="34" class="neighborhood-b"/>
  <rect x="692" y="199" width="126" height="12" rx="6" class="overlap"/>
  <text x="666" y="154" class="text small">0₁ 的任意小邻域</text>
  <text x="666" y="285" class="text small">0₂ 的任意小邻域</text>
  <text x="691" y="330" class="text label">非零点已经被识别，两个邻域总会相交</text>
</svg>
