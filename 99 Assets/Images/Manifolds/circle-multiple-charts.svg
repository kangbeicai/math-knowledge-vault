<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">圆周需要多张坐标图</title>
  <desc id="desc">圆周整体不能由一张无缺口坐标图覆盖。左边的圆只是示意画法，不是坐标图定义的一部分。删去左侧点得到蓝色坐标图，删去右侧点得到红色坐标图，两张坐标图合起来覆盖整个圆周。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <style>
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #4b5563; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 18px; }
      .small { font-size: 15px; fill: #4b5563; }
      .tiny { font-size: 13px; fill: #6b7280; }
      .circle-base { fill: none; stroke: #111827; stroke-width: 3.5; }
      .blue { fill: none; stroke: #2563eb; stroke-width: 10; stroke-linecap: round; }
      .red { fill: none; stroke: #dc2626; stroke-width: 10; stroke-linecap: round; }
      .axis { stroke: #111827; stroke-width: 3; stroke-linecap: round; }
      .blue-soft { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; }
      .red-soft { fill: #fee2e2; stroke: #fca5a5; stroke-width: 1.5; }
      .point { stroke: #ffffff; stroke-width: 2; }
      .note { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.5; }
      .warning { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1100" height="680" fill="#ffffff"/>

  <text x="550" y="50" text-anchor="middle" class="text title">圆周不能靠一张坐标图无缝覆盖</text>
  <text x="550" y="82" text-anchor="middle" class="text subtitle">左边只是为了画出圆周；右边才表示坐标图给出的坐标值</text>

  <!-- Circle panel -->
  <text x="300" y="128" text-anchor="middle" class="text section">示意中的圆周</text>
  <text x="300" y="154" text-anchor="middle" class="text tiny">画在平面里只是帮助想象，不是定义要求</text>
  <circle cx="300" cy="300" r="165" class="circle-base"/>

  <!-- Two arcs, each misses one point -->
  <path d="M455,300 A155,155 0 1 1 145,300" class="blue"/>
  <path d="M145,300 A155,155 0 1 1 455,300" class="red"/>

  <!-- Missing points -->
  <circle cx="145" cy="300" r="10" fill="#dc2626" class="point"/>
  <circle cx="455" cy="300" r="10" fill="#2563eb" class="point"/>
  <text x="78" y="294" class="text label">缺口 A</text>
  <text x="468" y="294" class="text label">缺口 B</text>

  <rect x="100" y="492" width="400" height="72" rx="8" class="note"/>
  <text x="120" y="520" class="text label">蓝色坐标图：圆周去掉 A</text>
  <text x="120" y="548" class="text label">红色坐标图：圆周去掉 B</text>

  <!-- Arrows to coordinate lines -->
  <path d="M510,220 C585,170 635,160 700,188" fill="none" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <path d="M510,380 C585,430 635,440 700,412" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrow-red)"/>

  <!-- Coordinate line panels -->
  <text x="880" y="110" text-anchor="middle" class="text section">坐标图给出的实数坐标</text>
  <text x="880" y="134" text-anchor="middle" class="text tiny">每张图只坐标化圆周的一大段</text>
  <rect x="720" y="132" width="320" height="112" rx="8" class="blue-soft"/>
  <line x1="760" y1="188" x2="1000" y2="188" class="axis"/>
  <circle cx="880" cy="188" r="6" fill="#2563eb"/>
  <text x="880" y="164" text-anchor="middle" class="text label">坐标图 1</text>
  <text x="880" y="224" text-anchor="middle" class="text small">把蓝色弧段拉成一条实数轴</text>

  <rect x="720" y="356" width="320" height="112" rx="8" class="red-soft"/>
  <line x1="760" y1="412" x2="1000" y2="412" class="axis"/>
  <circle cx="880" cy="412" r="6" fill="#dc2626"/>
  <text x="880" y="388" text-anchor="middle" class="text label">坐标图 2</text>
  <text x="880" y="448" text-anchor="middle" class="text small">把红色弧段拉成一条实数轴</text>

  <rect x="655" y="500" width="385" height="64" rx="8" class="note"/>
  <text x="676" y="528" class="text label">重点：单张图有缺口；两张图互相补上缺口。</text>
  <text x="676" y="552" class="text small">这就是“用多张局部坐标图覆盖整体”的直观意思。</text>

  <rect x="80" y="595" width="940" height="54" rx="8" class="warning"/>
  <text x="104" y="625" class="text label">提醒：坐标图不要求整个流形先嵌入外部平面；真正要求的是“局部开集 → 欧氏空间开集”的同胚。</text>
</svg>
