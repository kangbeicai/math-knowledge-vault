<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Representations of rotations in SO(3)</title><desc id="desc">One physical rotation is shown with several coordinate descriptions: rotation matrix, Euler angles, quaternion, and local tangent vector; each representation has a different role and limitation.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#334155"/></marker><style>.t{font:700 34px Arial,sans-serif;fill:#172033}.l{font:600 25px Arial,sans-serif;fill:#172033}.s{font:20px Arial,sans-serif;fill:#334155}.m{font:italic 24px Georgia,serif;fill:#172033}.box{fill:#f8fafc;stroke:#64748b;stroke-width:4}.line{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round}.axis{stroke:#2563eb;stroke-width:5;stroke-linecap:round}</style></defs><rect width="1200" height="700" fill="white"/><text x="600" y="55" text-anchor="middle" class="t">SO(3): one rotation, several descriptions</text><circle cx="300" cy="340" r="145" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><path d="M300 340L420 300" class="axis" marker-end="url(#a)"/><path d="M300 340L255 220" class="axis" marker-end="url(#a)"/><path d="M300 340L250 445" class="axis" marker-end="url(#a)"/><path d="M230 375C280 425 370 420 420 355" fill="none" stroke="#ea580c" stroke-width="5" marker-end="url(#a)"/><text x="300" y="155" text-anchor="middle" class="l">geometric rotation</text><text x="300" y="530" text-anchor="middle" class="m">R in SO(3)</text><rect x="585" y="125" width="245" height="135" rx="14" class="box"/><text x="708" y="170" text-anchor="middle" class="l">Matrix</text><text x="708" y="220" text-anchor="middle" class="m">R^T R=I, det R=1</text><rect x="880" y="125" width="245" height="135" rx="14" class="box"/><text x="1002" y="170" text-anchor="middle" class="l">Euler angles</text><text x="1002" y="220" text-anchor="middle" class="m">(alpha,beta,gamma)</text><rect x="585" y="405" width="245" height="135" rx="14" class="box"/><text x="708" y="450" text-anchor="middle" class="l">Quaternion</text><text x="708" y="500" text-anchor="middle" class="m">q and -q same R</text><rect x="880" y="405" width="245" height="135" rx="14" class="box"/><text x="1002" y="450" text-anchor="middle" class="l">Tangent vector</text><text x="1002" y="500" text-anchor="middle" class="m">omega in so(3)</text><path d="M455 295C505 225 535 190 585 185" class="line" marker-end="url(#a)"/><path d="M455 295C610 120 760 145 880 185" class="line" marker-end="url(#a)"/><path d="M455 395C505 465 535 500 585 485" class="line" marker-end="url(#a)"/><path d="M455 395C610 560 760 520 880 485" class="line" marker-end="url(#a)"/><text x="600" y="645" text-anchor="middle" class="s">These are coordinates or covers for the same rotation object; none should be confused with SO(3) itself.</text></svg>
