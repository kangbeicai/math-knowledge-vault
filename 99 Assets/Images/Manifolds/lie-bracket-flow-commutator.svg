<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Lie bracket as a flow commutator</title><desc id="desc">Two small flow rectangles are compared: moving by X then Y does not end at the same point as moving by Y then X; the tiny gap is measured by the Lie bracket.</desc><defs><marker id="x" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#2563eb"/></marker><marker id="y" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#ea580c"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#059669"/></marker><style>.t{font:700 34px Arial,sans-serif;fill:#172033}.l{font:600 25px Arial,sans-serif;fill:#172033}.s{font:20px Arial,sans-serif;fill:#334155}.m{font:italic 24px Georgia,serif;fill:#172033}.x{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round}.y{fill:none;stroke:#ea580c;stroke-width:5;stroke-linecap:round}.gap{fill:none;stroke:#059669;stroke-width:5;stroke-linecap:round}</style></defs><rect width="1200" height="700" fill="white"/><text x="600" y="55" text-anchor="middle" class="t">Lie bracket: failure of small flows to commute</text><path d="M80 440C140 245 420 200 620 305C790 395 685 575 435 600C220 620 35 550 80 440Z" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="360" y="155" text-anchor="middle" class="l">Two orders from the same point</text><circle cx="250" cy="465" r="8" fill="#172033"/><text x="220" y="495" class="m">p</text><path d="M250 465C345 395 435 375 525 395" class="x" marker-end="url(#x)"/><text x="380" y="365" class="m">X</text><path d="M525 395C555 330 610 300 675 305" class="y" marker-end="url(#y)"/><text x="610" y="285" class="m">Y</text><path d="M250 465C285 390 335 340 405 325" class="y" marker-end="url(#y)"/><text x="295" y="360" class="m">Y</text><path d="M405 325C515 290 600 300 690 350" class="x" marker-end="url(#x)"/><text x="545" y="285" class="m">X</text><circle cx="675" cy="305" r="7" fill="#ea580c"/><circle cx="690" cy="350" r="7" fill="#2563eb"/><path d="M675 305C700 318 705 332 690 350" class="gap" marker-end="url(#b)"/><text x="720" y="335" class="m">~ [X,Y]</text><rect x="805" y="180" width="300" height="340" rx="20" fill="#f8fafc" stroke="#64748b" stroke-width="4"/><text x="955" y="240" text-anchor="middle" class="l">Commutator</text><text x="955" y="315" text-anchor="middle" class="m">flow X, then Y</text><text x="955" y="365" text-anchor="middle" class="m">vs.</text><text x="955" y="415" text-anchor="middle" class="m">flow Y, then X</text><text x="955" y="480" text-anchor="middle" class="m">gap is second order</text><text x="600" y="650" text-anchor="middle" class="s">The bracket depends on how vector fields vary near p, not only on two vectors at p.</text></svg>
