<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Stereographic projection on a sphere</title><desc id="desc">A point on the sphere except the north pole is projected to the plane from the north pole, illustrating why one chart misses one point.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#334155"/></marker><style>.t{font:700 34px Arial,sans-serif;fill:#172033}.l{font:600 25px Arial,sans-serif;fill:#172033}.s{font:20px Arial,sans-serif;fill:#334155}.m{font:italic 24px Georgia,serif;fill:#172033}.line{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round}.thin{fill:none;stroke:#94a3b8;stroke-width:2.5}.dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:10 8}</style></defs><rect width="1200" height="700" fill="white"/><text x="600" y="55" text-anchor="middle" class="t">Stereographic projection: one chart misses one point</text><ellipse cx="560" cy="395" rx="390" ry="95" fill="#f8fafc" stroke="#64748b" stroke-width="4"/><text x="930" y="450" class="m">plane z = 0</text><circle cx="520" cy="300" r="190" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><ellipse cx="520" cy="300" rx="190" ry="58" class="thin"/><path d="M330 300C410 250 625 250 710 300" class="dash"/><text x="520" y="95" text-anchor="middle" class="l">Sphere S^2</text><circle cx="520" cy="110" r="8" fill="#ea580c"/><text x="540" y="105" class="m">N</text><circle cx="615" cy="285" r="8" fill="#172033"/><text x="635" y="278" class="m">p</text><circle cx="755" cy="395" r="8" fill="#172033"/><text x="775" y="390" class="m">x</text><path d="M520 110L755 395" class="line" marker-end="url(#a)"/><path d="M615 285L755 395" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="8 8"/><text x="760" y="235" class="m">line through N and p</text><path d="M955 175C1015 175 1065 225 1065 285C1065 345 1015 395 955 395C895 395 845 345 845 285C845 225 895 175 955 175Z" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/><circle cx="955" cy="205" r="7" fill="#ea580c"/><text x="975" y="210" class="m">missing point</text><path d="M890 455H1070M890 455V455" class="line"/><text x="980" y="500" text-anchor="middle" class="s">A stereographic chart covers S^2 minus the projection point.</text><text x="600" y="640" text-anchor="middle" class="s">Changing the projection point gives another chart; the overlap is where coordinates transform.</text></svg>
