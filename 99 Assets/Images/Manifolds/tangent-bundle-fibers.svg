<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Tangent bundle as fibers over a manifold</title><desc id="desc">Several tangent spaces are drawn as separate fibers attached to different base points of a manifold and collected by the projection map pi.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#334155"/></marker><style>.t{font:700 34px Arial,sans-serif;fill:#172033}.l{font:600 25px Arial,sans-serif;fill:#172033}.s{font:20px Arial,sans-serif;fill:#334155}.m{font:italic 24px Georgia,serif;fill:#172033}.line{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round}.fiber{fill:#ffedd5;stroke:#ea580c;stroke-width:3}.base{fill:#dbeafe;stroke:#2563eb;stroke-width:4}.bundle{fill:#ecfdf5;stroke:#059669;stroke-width:4}</style></defs><rect width="1200" height="700" fill="white"/><text x="600" y="55" text-anchor="middle" class="t">Tangent bundle: many fibers over one base</text><path d="M100 475C160 310 405 285 555 390C680 478 555 610 340 615C180 620 45 570 100 475Z" class="base"/><text x="320" y="645" text-anchor="middle" class="l">base manifold M</text><path d="M200 370L420 320L570 380L345 435Z" class="bundle"/><text x="405" y="300" text-anchor="middle" class="m">TM</text><g><circle cx="205" cy="485" r="7" fill="#172033"/><text x="185" y="512" class="m">p</text><ellipse cx="205" cy="305" rx="92" ry="30" class="fiber"/><path d="M205 305V485" class="line" marker-end="url(#a)"/><text x="145" y="290" class="m">T_pM</text></g><g><circle cx="350" cy="438" r="7" fill="#172033"/><text x="360" y="466" class="m">q</text><ellipse cx="350" cy="245" rx="92" ry="30" class="fiber"/><path d="M350 245V438" class="line" marker-end="url(#a)"/><text x="290" y="230" class="m">T_qM</text></g><g><circle cx="500" cy="500" r="7" fill="#172033"/><text x="512" y="528" class="m">r</text><ellipse cx="500" cy="320" rx="92" ry="30" class="fiber"/><path d="M500 320V500" class="line" marker-end="url(#a)"/><text x="440" y="305" class="m">T_rM</text></g><path d="M710 250C790 175 1010 170 1090 280C1165 385 1045 525 850 510C710 500 615 340 710 250Z" fill="#f8fafc" stroke="#64748b" stroke-width="4"/><text x="900" y="210" text-anchor="middle" class="l">A point of TM is a pair</text><text x="900" y="305" text-anchor="middle" class="m">(p, v),  v in T_pM</text><path d="M810 390H1010" stroke="#ea580c" stroke-width="5"/><circle cx="900" cy="390" r="8" fill="#172033"/><text x="900" y="438" text-anchor="middle" class="m">one fiber</text><path d="M690 505C560 555 470 590 355 590" class="line" marker-end="url(#a)"/><text x="610" y="595" class="m">pi(p, v)=p</text><text x="600" y="660" text-anchor="middle" class="s">The bundle is not one shared vector space; each vector belongs to the fiber over its base point.</text></svg>
