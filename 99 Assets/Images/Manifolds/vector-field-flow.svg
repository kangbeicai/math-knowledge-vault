<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Vector field and flow</title><desc id="desc">Short arrows describe instantaneous velocities, integral curves follow them, and the flow map sends an initial point to its later position.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#334155"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#2563eb"/></marker><style>.t{font:700 34px Arial,sans-serif;fill:#172033}.l{font:600 25px Arial,sans-serif;fill:#172033}.s{font:20px Arial,sans-serif;fill:#334155}.m{font:italic 24px Georgia,serif;fill:#172033}.line{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round}.flow{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round}.vec{stroke:#ea580c;stroke-width:4;stroke-linecap:round}</style></defs><rect width="1200" height="700" fill="white"/><text x="600" y="55" text-anchor="middle" class="t">Vector field, integral curves, and flow</text><path d="M110 430C170 235 470 190 650 305C815 410 680 575 420 600C210 620 55 550 110 430Z" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="390" y="155" text-anchor="middle" class="l">Manifold M</text><g><path d="M220 420l55 -35" class="vec" marker-end="url(#a)"/><path d="M320 355l55 -20" class="vec" marker-end="url(#a)"/><path d="M450 335l60 20" class="vec" marker-end="url(#a)"/><path d="M565 405l38 55" class="vec" marker-end="url(#a)"/><path d="M355 505l70 -5" class="vec" marker-end="url(#a)"/><path d="M250 515l60 30" class="vec" marker-end="url(#a)"/></g><path d="M190 500C280 385 390 325 520 355C620 380 650 470 590 535" class="flow" marker-end="url(#b)"/><path d="M260 300C360 250 500 260 610 335" class="flow" marker-end="url(#b)" opacity=".75"/><circle cx="190" cy="500" r="8" fill="#172033"/><text x="165" y="535" class="m">p</text><circle cx="590" cy="535" r="8" fill="#172033"/><text x="610" y="560" class="m">Phi_t(p)</text><text x="410" y="280" text-anchor="middle" class="m">integral curve gamma(t)</text><path d="M785 235H1100V480H785Z" fill="#f8fafc" stroke="#64748b" stroke-width="4"/><text x="942" y="290" text-anchor="middle" class="l">Flow map</text><text x="942" y="360" text-anchor="middle" class="m">Phi_t : M -> M</text><text x="942" y="420" text-anchor="middle" class="m">d/dt Phi_t(p) = X(Phi_t(p))</text><path d="M705 450C775 430 805 405 850 370" class="line" marker-end="url(#a)"/><text x="600" y="650" text-anchor="middle" class="s">The vector field gives instantaneous direction; the flow is the accumulated motion.</text></svg>
