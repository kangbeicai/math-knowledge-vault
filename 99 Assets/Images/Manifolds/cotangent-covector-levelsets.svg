<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Covectors, tangent vectors, and level sets</title><desc id="desc">Level sets of a function are drawn with a covector df that eats tangent vectors and vanishes on directions tangent to the level set.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#334155"/></marker><marker id="o" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#ea580c"/></marker><style>.t{font:700 34px Arial,sans-serif;fill:#172033}.l{font:600 25px Arial,sans-serif;fill:#172033}.s{font:20px Arial,sans-serif;fill:#334155}.m{font:italic 24px Georgia,serif;fill:#172033}.level{fill:none;stroke:#2563eb;stroke-width:4}.line{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round}.tan{stroke:#059669;stroke-width:5;stroke-linecap:round}.cov{stroke:#ea580c;stroke-width:5;stroke-linecap:round}</style></defs><rect width="1200" height="700" fill="white"/><text x="600" y="55" text-anchor="middle" class="t">Covector df and level sets</text><path d="M95 440C160 250 455 205 660 310C835 400 690 580 420 600C205 620 35 550 95 440Z" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="370" y="155" text-anchor="middle" class="l">Function f on M</text><path d="M170 500C300 430 475 420 620 500" class="level"/><path d="M150 410C310 335 505 335 655 410" class="level" opacity=".8"/><path d="M190 325C330 260 495 265 610 330" class="level" opacity=".55"/><text x="620" y="505" class="m">f = c</text><circle cx="390" cy="410" r="8" fill="#172033"/><text x="405" y="397" class="m">p</text><path d="M305 420L495 400" class="tan" marker-end="url(#a)"/><text x="410" y="455" text-anchor="middle" class="m">v tangent to level set</text><path d="M390 410L390 300" class="cov" marker-end="url(#o)"/><text x="410" y="330" class="m">df_p</text><rect x="780" y="205" width="330" height="285" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="4"/><text x="945" y="265" text-anchor="middle" class="l">What df does</text><text x="945" y="335" text-anchor="middle" class="m">df_p : T_pM -> R</text><text x="945" y="395" text-anchor="middle" class="m">df_p(v)=0</text><text x="945" y="445" text-anchor="middle" class="s">for directions along the same level set</text><path d="M705 405C755 385 775 365 805 345" class="line" marker-end="url(#a)"/><text x="600" y="645" text-anchor="middle" class="s">A covector measures first-order change of f; the gradient is a metric-dependent vector representing it.</text></svg>
